<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plants vs Zombies</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="game-container">
        <div class="header">
            <div class="sun-counter">
                <span class="sun-icon">☀️</span>
                <span id="sunCount">50</span>
            </div>
            <div class="wave-counter">
                <span>Oleada: <span id="waveNumber">1</span></span>
            </div>
            <div class="score">
                <span>Puntos: <span id="score">0</span></span>
            </div>
        </div>

        <div class="plant-selector">
            <div class="plant-card" data-plant="sunflower" data-cost="50">
                <div class="plant-icon">🌻</div>
                <div class="plant-name">Girasol</div>
                <div class="plant-cost">50</div>
            </div>
            <div class="plant-card" data-plant="peashooter" data-cost="100">
                <div class="plant-icon">🌱</div>
                <div class="plant-name">Lanzaguisantes</div>
                <div class="plant-cost">100</div>
            </div>
            <div class="plant-card" data-plant="wallnut" data-cost="50">
                <div class="plant-icon">🥜</div>
                <div class="plant-name">Nuez</div>
                <div class="plant-cost">50</div>
            </div>
            <div class="plant-card" data-plant="snowpea" data-cost="175">
                <div class="plant-icon">❄️</div>
                <div class="plant-name">Guisante Hielo</div>
                <div class="plant-cost">175</div>
            </div>
            <div class="plant-card" data-plant="cherrybomb" data-cost="150">
                <div class="plant-icon">💣</div>
                <div class="plant-name">Cereza Bomba</div>
                <div class="plant-cost">150</div>
            </div>
            <div class="shovel-btn" id="shovelBtn">
                <div class="shovel-icon">🔨</div>
            </div>
        </div>

        <div class="game-board" id="gameBoard">
            <!-- Grid will be generated by JavaScript -->
        </div>

        <div class="game-over hidden" id="gameOver">
            <h2 id="gameOverTitle">Game Over</h2>
            <p id="gameOverMessage"></p>
            <button id="restartBtn">Jugar de Nuevo</button>
        </div>
    </div>

    <script src="game.js"></script>
</body>
</html>
